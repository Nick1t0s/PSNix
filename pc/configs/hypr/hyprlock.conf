# hyprlock - lock screen config
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor = DP-3
    path = /home/nik/wall/main.jpg

    color = rgba(25, 20, 20, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 1.3
    brightness = 0.7
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

input-field {
    monitor = DP-3
    size = 280, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(220, 220, 220)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = -1
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = $TIME
    color = rgba(242, 243, 244, 0.95)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor = DP-3
    text = cmd[update:1000] date "+%A, %d %B %Y"
    color = rgba(242, 243, 244, 0.7)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}
